[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
  from = "/tours"
  to = "/experiences"
  status = 301
  force = true

[[redirects]]
  from = "/tours/"
  to = "/experiences/"
  status = 301
  force = true

[[redirects]]
  from = "/experiences/4x4-safari-experience"
  to = "/experiences/4x4-safari-expedition"
  status = 301
  force = true

[[redirects]]
  from = "/experiences/4x4-safari-experience/"
  to = "/experiences/4x4-safari-expedition/"
  status = 301
  force = true

[[redirects]]
  from = "/desert-moments"
  to = "/sahara-in-motion"
  status = 301
  force = true

[[redirects]]
  from = "/desert-moments/"
  to = "/sahara-in-motion/"
  status = 301
  force = true

[[redirects]]
  from = "/sahara-stories"
  to = "/sahara-in-motion"
  status = 301
  force = true

[[redirects]]
  from = "/sahara-stories/"
  to = "/sahara-in-motion/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
